name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-mcp.txt pytest
      - name: Test synthetic collection workflows
        run: .venv/bin/python -m pytest -q
      - name: Install dashboard dependencies
        run: npm ci
      - name: Build dashboard
        run: npm run build
      - name: Configure and verify MCP installation
        run: |
          python scripts/setup.py --skip-install
          python scripts/setup.py --check
